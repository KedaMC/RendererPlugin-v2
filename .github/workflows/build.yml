name: Build LTW Renderer

on:
  push:
    branches:
      - "driver/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltw-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "store_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/temporary.jks" \
              -storepass temporary-password \
              -keypass temporary-password \
              -alias ltw-renderer \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LTW Renderer, OU=Android, O=KedaMC, L=Unknown, ST=Unknown, C=ID"
            echo "keystore=$RUNNER_TEMP/temporary.jks" >> "$GITHUB_OUTPUT"
            echo "store_password=temporary-password" >> "$GITHUB_OUTPUT"
            echo "key_alias=ltw-renderer" >> "$GITHUB_OUTPUT"
            echo "key_password=temporary-password" >> "$GITHUB_OUTPUT"
          fi

      - name: Align and sign APK
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" app/build/outputs/apk/release/LTW-Renderer-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/LTW-Renderer.apk \
            app/build/outputs/apk/release/LTW-Renderer-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/LTW-Renderer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LTW-Renderer
          path: app/build/outputs/apk/release/LTW-Renderer.apk
          if-no-files-found: error
          retention-days: 14
